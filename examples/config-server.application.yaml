# Config Server 자체의 application.yaml에 반영하는 예제입니다.
# 이 파일은 services/actions/pages 리소스 디렉터리의 동기화 대상이 아닙니다.
spring:
  cloud:
    config:
      server:
        git:
          uri: https://github.com/minjoonchoi/resource-ops.git
          default-label: master
          try-master-branch: false
          clone-on-start: true
          refresh-rate: 0
          # search-paths를 지정하지 않고 저장소 루트를 사용합니다.
