apiVersion: resource-ops/v1
kind: Action
metadata:
  name: members.contact.read
  title: 회원 연락처 보기
  description: 기본 정보 조회와 같은 Endpoint를 사용하지만 별도 Action 권한으로 제어합니다.
  organization: member-team
spec:
  endpoint:
    service: member-api
    method: GET
    path: /v1/members/{memberId}
  plugins:
    before:
      - name: confirm
        config:
          targets:
            - kind: User
              name: reviewer-a
            - kind: User
              name: reviewer-b
            - kind: User
              name: reviewer-c
          requiredCount: 2
          execution: requester
    after:
      - name: history
