apiVersion: resource-ops/v1
kind: Page
metadata:
  name: member-detail
  title: 회원 상세
spec:
  path: /members/:memberId
  parent: members
  actions:
    - action: members.detail.read
      overrides:
        responses:
          "200":
            fields: [/id, /nickname, /organizationCode]
    - action: members.contact.read
      overrides:
        responses:
          "200":
            fields: [/id, /email]
