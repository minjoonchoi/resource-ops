apiVersion: resource-ops/v1
kind: Page
metadata:
  name: members
  title: 회원 관리
spec:
  path: /members
  actions:
    - action: members.directory.list
      overrides:
        request:
          parameters:
            - in: query
              name: organizationCode
              source: subject.organization.code
            - in: query
              name: size
              value: 20
        responses:
          "200":
            fields: [/items/*/id, /items/*/nickname, /total]
    - action: members.detail.read
      overrides:
        responses:
          "200":
            fields: [/id, /nickname]
