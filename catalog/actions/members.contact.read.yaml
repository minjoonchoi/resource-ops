apiVersion: resource-ops/v1
kind: Action
metadata:
  name: members.contact.read
  title: 회원 연락처 보기
  description: 기본 정보 조회와 같은 Endpoint를 사용하지만 별도 Action 권한으로 제어합니다.
spec:
  endpoint: members.get
  request:
    parameters:
      - in: path
        name: memberId
        source: input
  responses:
    "200":
      fields: [/id, /email]
    "404":
      fields: [/code, /message]
